# Test status per metafile (mods/<key>.pw.toml), consumed by scripts/gen-matrix.py.
# status: Verified | Launch tested | Gameplay tested | Blocked
#   Verified        = metadata, hashes and version ranges checked (validate.py, check-ranges.py)
#   Launch tested   = loaded without errors on a real NeoForge launch (server or client)
#   Gameplay tested = feature exercised by a player in game
#   Blocked         = open problem
# `client` tracks the client launch separately; it stays "pending" until Prism is tested.

